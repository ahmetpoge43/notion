<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Canlı Fiyat Kartları</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #191919; /* Notion Dark Mode Arka Planı */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px;
    }
    .cards-grid {
      display: flex;
      flex-direction: row;
      gap: 10px;
      width: 100%;
      justify-content: space-between;
    }
    .card-item {
      flex: 1;
      min-width: 0; /* Kartların düzgün daralması için */
      background-color: #202020;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    /* Ekran daraldığında (Mobil/Dar bloklarda) dikey düzen */
    @media (max-width: 600px) {
      .cards-grid {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="cards-grid">
    
    <!-- ONS ALTIN (XAUUSD) KARTI -->
    <div class="card-item">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "OANDA:XAUUSD",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "tr"
        }
        </script>
      </div>
    </div>

    <!-- NASDAQ 100 (NDX) KARTI -->
    <div class="card-item">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "NASDAQ:NDX",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "tr"
        }
        </script>
      </div>
    </div>

    <!-- DAX 40 KARTI -->
    <div class="card-item">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "INDEX:DAX",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "tr"
        }
        </script>
      </div>
    </div>

  </div>

</body>
</html>
