<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Market Widget</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #191919; /* Notion karanlık mod arka planı ile uyumlu */
      overflow: hidden;
    }
  </style>
</head>
<body>

<!-- TradingView Market Overview Widget -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
    "colorTheme": "dark",
    "dateRange": "1D",
    "showChart": true,
    "locale": "tr",
    "width": "100%",
    "height": "100%",
    "largeChartUrl": "",
    "isTransparent": true,
    "showSymbolLogo": true,
    "showFloatingTooltip": true,
    "tabs": [
      {
        "title": "Piyasalar",
        "symbols": [
          { "s": "OANDA:XAUUSD", "d": "ONS ALTIN (XAUUSD)" },
          { "s": "NASDAQ:NDX", "d": "NASDAQ 100 (NDX)" },
          { "s": "INDEX:DAX", "d": "DAX 40 (GER40)" }
        ]
      }
    ]
  }
  </script>
</div>

</body>
</html>
